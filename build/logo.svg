<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="spotlightBeam" x1="0%" y1="0%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Briefcase Body Gradient -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Chart Growth Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Base Tile Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Spotlight Source at Top-Left -->
  <circle cx="80" cy="72" r="38" fill="#fbbf24" opacity="0.2"/>
  <circle cx="80" cy="72" r="22" fill="#fde047" opacity="0.6"/>
  <circle cx="80" cy="72" r="12" fill="#ffffff"/>

  <!-- Spotlight Cone Beam shining over the center -->
  <polygon points="80,72 490,260 300,500 80,72" fill="url(#spotlightBeam)"/>

  <!-- Subtle Executive Stage / Grid Lines -->
  <line x1="60" y1="432" x2="452" y2="432" stroke="#334155" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="256" cy="432" rx="170" ry="32" fill="#fbbf24" opacity="0.08"/>

  <!-- Briefcase Silhouette & Structure -->
  <!-- Handle -->
  <path d="M 216 196 C 216 168 296 168 296 196" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>
  <!-- Briefcase Main Body -->
  <rect x="116" y="196" width="280" height="196" rx="28" fill="url(#caseGrad)" stroke="#475569" stroke-width="8"/>
  <!-- Gold Accent Trim Trim / Clasps -->
  <rect x="116" y="260" width="280" height="10" fill="url(#goldGrad)"/>
  <rect x="176" y="250" width="24" height="30" rx="5" fill="#fde047" stroke="#b45309" stroke-width="3"/>
  <rect x="312" y="250" width="24" height="30" rx="5" fill="#fde047" stroke="#b45309" stroke-width="3"/>

  <!-- Inside Briefcase / Cutout: Rising Business Chart + Play Triangle -->
  <!-- Rising Chart Bars -->
  <rect x="156" y="324" width="22" height="42" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="190" y="302" width="22" height="64" rx="4" fill="#38bdf8" opacity="0.95"/>
  <rect x="224" y="278" width="22" height="88" rx="4" fill="#67e8f9"/>
  <rect x="258" y="292" width="22" height="74" rx="4" fill="#38bdf8"/>

  <!-- Dynamic Trend Arrow -->
  <path d="M 160 318 L 228 268 L 260 282 L 334 212" fill="none" stroke="#fde047" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="338,206 318,214 328,232" fill="#fde047"/>

  <!-- Big Bold Forward PLAY Symbol (The "Business Play" Core) -->
  <polygon points="296,280 354,316 296,352" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
</svg>
