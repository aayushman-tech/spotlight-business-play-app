name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows EXE installer
        run: npm run build:exe

      - name: Build Windows Store AppX/MSIX package
        run: npm run build:store

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Include *.exe, *.appx -Recurse | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath release\SHA256SUMS.txt -Encoding utf8
          Get-Content release\SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $exe = Get-Item release\SpotlightBusinessPlay-Setup-*-x64.exe
          $appx = Get-Item release\SpotlightBusinessPlay-*-x64.appx
          $sums = Get-Item release\SHA256SUMS.txt
          gh release create $env:TAG_NAME $exe.FullName $appx.FullName $sums.FullName --title "Spotlight Business Play $env:TAG_NAME" --generate-notes
