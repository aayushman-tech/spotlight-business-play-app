<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="wideBeam" x1="0%" y1="0%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="wideGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="wideCase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="620" height="300" fill="url(#wideBg)"/>

  <!-- Spotlight Source at Top-Left -->
  <circle cx="50" cy="40" r="28" fill="#fbbf24" opacity="0.2"/>
  <circle cx="50" cy="40" r="16" fill="#fde047" opacity="0.6"/>
  <circle cx="50" cy="40" r="8" fill="#ffffff"/>

  <!-- Spotlight Cone Beam -->
  <polygon points="50,40 380,120 220,300 50,40" fill="url(#wideBeam)"/>

  <!-- Briefcase Icon on Left -->
  <g transform="translate(-10, 10)">
    <!-- Handle -->
    <path d="M 126 94 C 126 76 174 76 174 94" fill="none" stroke="url(#wideGold)" stroke-width="12" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="70" y="94" width="160" height="114" rx="16" fill="url(#wideCase)" stroke="#475569" stroke-width="5"/>
    <rect x="70" y="132" width="160" height="6" fill="url(#wideGold)"/>
    <rect x="104" y="126" width="14" height="18" rx="3" fill="#fde047" stroke="#b45309" stroke-width="2"/>
    <rect x="182" y="126" width="14" height="18" rx="3" fill="#fde047" stroke="#b45309" stroke-width="2"/>
    <!-- Bars -->
    <rect x="94" y="168" width="12" height="24" rx="2" fill="#38bdf8"/>
    <rect x="114" y="154" width="12" height="38" rx="2" fill="#38bdf8"/>
    <rect x="134" y="142" width="12" height="50" rx="2" fill="#67e8f9"/>
    <!-- Play arrow -->
    <polygon points="174,152 208,172 174,192" fill="url(#wideGold)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Typography on Right: SPOTLIGHT BUSINESS PLAY -->
  <text x="256" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">SPOTLIGHT</text>
  <text x="258" y="174" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="url(#wideGold)" letter-spacing="3">BUSINESS PLAY</text>
  <text x="260" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" letter-spacing="1">CHOOSE YOUR PATH • 90s BUSINESS ADVENTURE</text>
</svg>
