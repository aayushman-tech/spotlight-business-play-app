<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182337"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c26a"/>
      <stop offset="1" stop-color="#d99b28"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- subtle grid: the corporate ledger -->
  <g stroke="#243352" stroke-width="3" opacity=".55">
    <line x1="64" y1="160" x2="448" y2="160"/>
    <line x1="64" y1="352" x2="448" y2="352"/>
    <line x1="160" y1="64" x2="160" y2="448"/>
    <line x1="352" y1="64" x2="352" y2="448"/>
  </g>
  <!-- boardroom table -->
  <ellipse cx="256" cy="256" rx="150" ry="84" fill="url(#table)"/>
  <ellipse cx="256" cy="256" rx="150" ry="84" fill="none" stroke="#8a5f10" stroke-width="6"/>
  <!-- the decision: two seats facing each other -->
  <circle cx="196" cy="256" r="26" fill="#101827"/>
  <circle cx="316" cy="256" r="26" fill="#101827"/>
  <!-- a considered "Aye" tick -->
  <path d="M238 262 l22 24 l48 -58" fill="none" stroke="#101827" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
